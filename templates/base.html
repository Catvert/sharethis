<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>{% block title %}ShareThis{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #282c34;
            --bg-light: #21252b;
            --fg: #abb2bf;
            --fg-dim: #5c6370;
            --border: #3e4451;
            --red: #e06c75;
            --green: #98c379;
            --yellow: #e5c07b;
            --blue: #61afef;
            --magenta: #c678dd;
            --cyan: #56b6c2;
        }

        body {
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            background: var(--bg);
            min-height: 100vh;
            color: var(--fg);
        }

        a { color: var(--blue); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: inherit;
            transition: all 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-primary { background: var(--green); color: var(--bg); font-weight: bold; }
        .btn-secondary { background: var(--border); color: var(--fg); }
        .btn-accent { background: var(--magenta); color: var(--bg); font-weight: bold; }
        .btn-info { background: var(--blue); color: var(--bg); font-weight: bold; }

        .input {
            padding: 0.7rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--bg);
            color: var(--fg);
            font-family: inherit;
            font-size: 0.95rem;
        }
        .input:focus { outline: none; border-color: var(--blue); }
        .input::placeholder { color: var(--fg-dim); }

        .toast {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--green);
            color: var(--bg);
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.3s;
            font-weight: bold;
            z-index: 1000;
        }
        .toast.show { opacity: 1; }
        .toast.error { background: var(--red); color: #fff; }

        {% block extra_styles %}{% endblock %}
    </style>
</head>
<body>
    {% block body %}{% endblock %}

    <script src="/static/common.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
